<style>
/* CSS Reset & Variables */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap');

:root {
  --font-heading: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  
  /* Color Palette - Premium Space Dark & Glowing Accents */
  --bg-color: #0b0f19;
  --bg-glow: radial-gradient(circle at 50% -20%, rgba(99, 102, 241, 0.15) 0%, rgba(11, 15, 25, 0) 60%);
  --panel-bg: rgba(17, 24, 39, 0.45);
  --panel-border: rgba(255, 255, 255, 0.07);
  --panel-border-hover: rgba(255, 255, 255, 0.15);
  
  --text-primary: #f3f4f6;
  --text-secondary: #9ca3af;
  --text-muted: #6b7280;
  
  --accent-indigo: #6366f1;
  --accent-cyan: #06b6d4;
  --accent-pink: #ec4899;
  --accent-emerald: #10b981;
  --accent-amber: #f59e0b;
  --accent-rose: #f43f5e;
  
  --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
  --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-fast: all 0.15s ease;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: var(--font-body);
  background-color: var(--bg-color);
  background-image: var(--bg-glow);
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.5;
  overflow-x: hidden;
  padding-bottom: 90px; /* Safe space for mobile nav */
}

/* Typography */
h1, h2, h3, h4 {
  font-family: var(--font-heading);
  font-weight: 700;
  letter-spacing: -0.02em;
}

/* Glassmorphism Container */
.glass-container {
  max-width: 640px;
  margin: 0 auto;
  padding: 24px 16px;
}

.glass-card {
  background: var(--panel-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--panel-border);
  box-shadow: var(--glass-shadow);
  border-radius: 24px;
  padding: 24px;
  margin-bottom: 20px;
  transition: var(--transition-smooth);
}

.glass-card:hover {
  border-color: var(--panel-border-hover);
}

/* Onboarding Layout CSS (NEW) */
.onboarding-container {
  min-height: 95vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

.onboarding-card {
  width: 100%;
  max-width: 480px;
  text-align: center;
  padding: 40px 32px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

.onboarding-logo {
  background: linear-gradient(135deg, var(--accent-indigo), var(--accent-cyan));
  width: 64px;
  height: 64px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 36px;
  margin: 0 auto 20px;
  box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
}

.onboarding-title {
  font-size: 32px;
  font-weight: 800;
  background: linear-gradient(to right, #ffffff, #a5b4fc, #38bdf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}

.onboarding-subtitle {
  color: var(--text-secondary);
  font-size: 14px;
  margin-bottom: 32px;
}

.onboarding-steps {
  display: flex;
  flex-direction: column;
  gap: 16px;
  text-align: left;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.04);
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 24px;
}

.onboarding-step {
  display: flex;
  gap: 14px;
  align-items: flex-start;
}

.step-num {
  background: rgba(99, 102, 241, 0.15);
  border: 1px solid rgba(99, 102, 241, 0.3);
  color: #a5b4fc;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  flex-shrink: 0;
  margin-top: 2px;
}

.step-text h4 {
  font-size: 14px;
  font-weight: 600;
  color: white;
  margin-bottom: 2px;
}

.step-text p {
  font-size: 11px;
  color: var(--text-secondary);
  line-height: 1.4;
}

.onboarding-divider {
  margin: 18px 0;
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 12px;
  text-transform: uppercase;
}

.onboarding-divider::before, .onboarding-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,0.06);
}

/* Header Aesthetics */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  padding: 8px 4px;
}

.logo-section {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-icon {
  background: linear-gradient(135deg, var(--accent-indigo), var(--accent-cyan));
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 22px;
  box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
}

.app-title {
  font-size: 22px;
  background: linear-gradient(to right, #ffffff, #a5b4fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.user-badge {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 99px;
  padding: 6px 14px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-secondary);
  flex-shrink: 0;
  max-width: 220px;
}

.user-badge span:last-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.user-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background-color: var(--accent-emerald);
  box-shadow: 0 0 8px var(--accent-emerald);
}

/* Spreadsheet Dynamic Title */
.spreadsheet-title-container {
  margin-top: -8px;
  margin-bottom: 24px;
  padding: 0 4px;
  max-width: 100%;
}

.spreadsheet-dynamic-title {
  font-size: 24px;
  font-weight: 800;
  font-family: var(--font-heading);
  background: linear-gradient(to right, #ffffff, #c7d2fe);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 520px;
  line-height: 1.2;
}

/* Hero Stats Section */
.hero-total-title {
  font-size: 14px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}

.hero-total-amount {
  font-size: 40px;
  font-family: var(--font-heading);
  font-weight: 800;
  background: linear-gradient(to right, #ffffff, #818cf8, #38bdf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1.1;
  margin-bottom: 16px;
}

.hero-summary-box {
  background: rgba(99, 102, 241, 0.07);
  border: 1px solid rgba(99, 102, 241, 0.15);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.hero-summary-icon {
  font-size: 24px;
  background: rgba(99, 102, 241, 0.15);
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero-summary-text {
  font-size: 14px;
  color: var(--text-primary);
  font-weight: 500;
  flex: 1;
}

/* Interactive Elements (Buttons) */
.btn {
  font-family: var(--font-heading);
  font-weight: 600;
  font-size: 15px;
  padding: 12px 20px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: var(--transition-smooth);
  width: 100%;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent-indigo), var(--accent-cyan));
  color: white;
  box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
}

.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 25px rgba(99, 102, 241, 0.5);
}

.btn-primary:active:not(:disabled) {
  transform: translateY(0);
}

.btn-primary:disabled {
  background: rgba(255,255,255,0.05);
  color: var(--text-muted);
  box-shadow: none;
  cursor: not-allowed;
  opacity: 0.6;
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--text-primary);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.2);
}

.btn-danger {
  background: rgba(244, 63, 94, 0.15);
  border: 1px solid rgba(244, 63, 94, 0.3);
  color: #fda4af;
}

.btn-danger:hover {
  background: rgba(244, 63, 94, 0.25);
  border-color: rgba(244, 63, 94, 0.5);
}

/* Tab Navigation (Bottom Navigation on Mobile, Sleek Floating Panel) */
.nav-panel {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 608px;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--panel-border);
  border-radius: 20px;
  padding: 10px;
  display: flex;
  justify-content: space-around;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  z-index: 1000;
  transition: var(--transition-smooth);
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  padding: 8px 12px;
  border-radius: 14px;
  font-size: 11px;
  font-weight: 500;
  transition: var(--transition-fast);
  flex: 1;
}

.nav-item.active {
  color: white;
  background: rgba(255, 255, 255, 0.08);
}

/* Category Grid & Visual Bars */
.category-stats-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.category-stat-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.category-stat-header {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 500;
}

.category-progress-bg {
  height: 8px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 99px;
  overflow: hidden;
}

.category-progress-bar {
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(to right, var(--accent-indigo), var(--accent-cyan));
  width: 0%;
  transition: width 0.8s cubic-bezier(0.1, 0.8, 0.2, 1);
}

/* Form Styles */
.form-group {
  margin-bottom: 20px;
  text-align: left;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 8px;
  font-family: var(--font-heading);
}

.form-input {
  width: 100%;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  padding: 12px 16px;
  color: white;
  font-family: var(--font-body);
  font-size: 15px;
  transition: var(--transition-fast);
}

.form-input:focus {
  outline: none;
  border-color: var(--accent-indigo);
  background: rgba(255, 255, 255, 0.07);
  box-shadow: 0 0 10px rgba(99, 102, 241, 0.15);
}

/* Amount Input Specific Styles */
.amount-input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.amount-currency {
  position: absolute;
  left: 16px;
  font-family: var(--font-heading);
  font-weight: 700;
  font-size: 24px;
  color: var(--text-secondary);
}

.amount-input {
  padding-left: 42px;
  font-family: var(--font-heading);
  font-weight: 700;
  font-size: 28px;
  letter-spacing: 0.02em;
}

/* Pill selector grid (Dynamic Payer Selection) */
.pill-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px;
}

.pill-option {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  padding: 10px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition-fast);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 600;
  font-size: 14px;
  user-select: none;
}

.pill-option:hover {
  background: rgba(255, 255, 255, 0.06);
  border-color: var(--panel-border-hover);
}

.pill-option.active {
  box-shadow: 0 0 12px var(--shadow-color);
  color: white;
}

/* Category Grid Picker */
.category-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.category-option {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  padding: 10px 4px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition-fast);
  font-size: 12px;
  font-weight: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  user-select: none;
}

.category-option .cat-icon {
  font-size: 20px;
}

.category-option:hover {
  background: rgba(255, 255, 255, 0.06);
}

.category-option.active {
  background: rgba(6, 182, 212, 0.12);
  border-color: var(--accent-cyan);
  box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
}

/* Expense List Cards */
.expense-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.expense-card {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.04);
  border-radius: 18px;
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: var(--transition-fast);
  cursor: pointer;
}

.expense-card:hover {
  background: rgba(255, 255, 255, 0.05);
  border-color: var(--panel-border-hover);
}

.expense-card-left {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  flex: 1;
}

.payer-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(99, 102, 241, 0.15);
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  border: 1.5px solid rgba(99, 102, 241, 0.2);
}

.expense-details {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  flex: 1;
}

.expense-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.expense-category-tag {
  font-size: 10px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 6px;
  padding: 2px 6px;
  color: var(--text-secondary);
  white-space: nowrap;
}

.expense-memo {
  font-size: 14px;
  color: var(--text-primary);
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.expense-date {
  font-size: 11px;
  color: var(--text-muted);
}

.expense-card-right {
  text-align: right;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  flex-shrink: 0;
}

.expense-amount {
  font-family: var(--font-heading);
  font-weight: 700;
  font-size: 18px;
  color: var(--text-primary);
}

.expense-payer-name {
  font-size: 11px;
  color: var(--text-secondary);
}

/* Modals & Dialogs (Native Popovers/Glass Dialogs) */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  padding: 16px;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-content {
  background: rgba(15, 23, 42, 0.9);
  border: 1px solid var(--panel-border);
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  border-radius: 24px;
  width: 100%;
  max-width: 440px;
  padding: 24px;
  transform: scale(0.9);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.modal-overlay.active .modal-content {
  transform: scale(1);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.modal-close {
  background: rgba(255, 255, 255, 0.05);
  border: none;
  color: var(--text-secondary);
  font-size: 20px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-close:hover {
  background: rgba(255, 255, 255, 0.12);
  color: white;
}

.modal-buttons {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 24px;
}

/* History Segmented Switcher */
.segment-control {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  padding: 4px;
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
}

.segment-btn {
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 600;
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
  flex: 1;
  transition: var(--transition-fast);
}

.segment-btn.active {
  background: rgba(255, 255, 255, 0.08);
  color: white;
}

/* Toast Notifications */
.toast {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translate(-50%, -100px);
  background: rgba(17, 24, 39, 0.9);
  border: 1px solid var(--accent-indigo);
  border-radius: 12px;
  padding: 12px 24px;
  color: white;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  z-index: 3000;
  pointer-events: none;
  transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.2);
  font-size: 14px;
  font-weight: 500;
  text-align: center;
}

.toast.active {
  transform: translate(-50%, 0);
}

/* Animation utilities */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.fade-in-el {
  animation: fadeIn 0.4s ease forwards;
}

/* Empty states */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
}

.empty-state-icon {
  font-size: 40px;
  margin-bottom: 12px;
  opacity: 0.6;
}

/* Detail Drawer details */
.detail-item {
  display: flex;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  align-items: center;
}

.detail-label {
  color: var(--text-secondary);
  font-size: 14px;
}

.detail-val {
  color: var(--text-primary);
  font-weight: 600;
  font-size: 14px;
  text-align: right;
  word-break: break-all;
}

/* Settlement History details spacing */
.settlement-card-details {
  background: rgba(255, 255, 255, 0.03);
  border-radius: 12px;
  padding: 12px;
  font-size: 13px;
  white-space: pre-line;
  margin-top: 8px;
  border: 1px solid rgba(255, 255, 255, 0.03);
  color: #a5b4fc;
  text-align: left;
}

/* Access Denied Page Style */
.access-denied-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 80vh;
  text-align: center;
  padding: 24px;
}

.error-shield {
  font-size: 64px;
  margin-bottom: 24px;
  color: var(--accent-rose);
  text-shadow: 0 0 20px rgba(244, 63, 94, 0.4);
}

/* Color slider sync styles */
.ratio-slider-row input[type="range"] {
  outline: none;
  background: rgba(255, 255, 255, 0.1);
  height: 6px;
  border-radius: 3px;
  -webkit-appearance: none;
}

.ratio-slider-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: currentColor;
  cursor: pointer;
  border: 2px solid #000;
}

/* Responsive Overrides */
@media (min-width: 640px) {
